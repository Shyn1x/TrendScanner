name: Lomenti VPS status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lomenti-vps.yml, ops/lomenti/install_system.py]
permissions:
  contents: read
concurrency:
  group: lomenti-vps-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: lomenti-installer
          persist-credentials: false
      - name: Read deployment status without credentials or trading changes
        run: |
          python3 - <<'PY'
          import hashlib,importlib.util,json,pathlib,shutil,subprocess,time
          base=pathlib.Path.home()/'lomenti-deploy'
          proof=base/'preflight.json'
          if proof.is_file():
              data=json.loads(proof.read_text())
              print('LOMENTI_PREFLIGHT '+json.dumps(data))
          else:
              print('LOMENTI_PREFLIGHT_MISSING')
          for unit in ['lomenti-collector.service','lomenti-collector.timer']:
              result=subprocess.run(['systemctl','show',unit,'--property=LoadState,ActiveState,SubState,Result,ExecMainStatus,ExecMainStartTimestamp,ExecMainExitTimestamp,LastTriggerUSec,NextElapseUSecRealtime,MemoryMax,MemoryHigh,CPUQuotaPerSecUSec,User,UnitFileState'],capture_output=True,text=True)
              print(unit+'
'+result.stdout.strip())
          audit=pathlib.Path.home()/'lomenti-growth-20261115'
          log=audit/'full_audit.log'
          if log.is_file():
              progress=[line for line in log.read_text(errors='replace').splitlines() if line.startswith('ENRICH_PROGRESS ') and line.split()[-1].isdigit()]
              print('ELIGIBILITY_PROGRESS '+(progress[-1] if progress else 'RUNNING_OR_WAITING'))
          activated=audit/'activated.json'
          if activated.is_file():
              activation=json.loads(activated.read_text())
              assert activated.stat().st_uid==0 and activation.get('success'), 'UNVERIFIED_ACTIVATION_PROOF'
              assert activation.get('release')=='265634db8e278c8018a6087decb119336a4ca002', 'ELIGIBILITY_VERSION_MISMATCH'
              print('LOMENTI_ELIGIBILITY_ACTIVATED '+json.dumps(activation))
          if not activated.is_file():
              print('GROWTH_ACTIVATION_PENDING')
              previous=pathlib.Path.home()/'lomenti-release-20261115/activated.json'
              if previous.is_file() and previous.stat().st_uid==0: print('CURRENT_PRODUCTION_RECEIPT '+previous.read_text())
          preflight=audit/'preflight.json'
          if preflight.is_file(): print('CURRENT_RELEASE_PREFLIGHT '+preflight.read_text())
          sudo=subprocess.run(['sudo','-n','true'],capture_output=True).returncode==0
          print('RUNNER_PASSWORDLESS_ADMIN='+str(sudo))
          source=pathlib.Path('lomenti-installer/ops/vps/monitor.py')
          spec=importlib.util.spec_from_file_location('trend_monitor',source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          clock=subprocess.run(['timedatectl','show','-p','NTPSynchronized','--value'],capture_output=True,text=True).stdout.strip()=='yes'
          print('TRENDSCANNER '+json.dumps(module.snapshot(pathlib.Path.home()/'trendscanner-runtime',time.time(),clock)))
          PY
      - name: Attempt activation with existing administrator permission only
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          base=pathlib.Path.home()/'lomenti-growth-20261115'
          proof=json.loads((base/'preflight.json').read_text())
          assert proof.get('success') and not proof.get('baseline_lost')
          with (base/'activation-attempt.log').open('wb') as log:
              result=subprocess.run(['sudo','-n','python3',str(base/'update_growth.py')],stdout=log,stderr=subprocess.STDOUT,timeout=2100)
          receipt=base/'activated.json'
          if result.returncode: print('ADMIN_REQUIRED: sudo python3 /home/runner/lomenti-growth-20261115/update_growth.py')
          else:
              assert receipt.stat().st_uid==0
              print('VERIFIED_GROWTH_ACTIVATION '+receipt.read_text())
          PY
