name: Lomenti VPS bootstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lomenti-vps.yml]
permissions:
  contents: read
concurrency:
  group: lomenti-vps-deploy
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 5
    steps:
      - name: Check isolated Lomenti deployment readiness
        shell: bash
        run: |
          set -eu
          free -m
          df -Pm /opt
          systemctl --user is-system-running || true
          systemctl --user show-environment >/dev/null 2>&1 && echo USER_SYSTEMD_AVAILABLE || true
          test -w /sys/fs/cgroup && echo CGROUP_WRITABLE || true
          command -v crontab || true
          id
          umask 077
          mkdir -p "$HOME/lomenti-deploy"
          if ! test -f "$HOME/lomenti-deploy/recipient.key"; then
            openssl req -x509 -newkey rsa:3072 -nodes -subj /CN=lomenti-vps-deploy -days 7 -keyout "$HOME/lomenti-deploy/recipient.key" -out "$HOME/lomenti-deploy/recipient.pem" 2>/dev/null
          fi
          cat "$HOME/lomenti-deploy/recipient.pem"
