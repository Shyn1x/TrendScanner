name: Lomenti VPS staging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lomenti-vps.yml]
permissions:
  contents: read
concurrency:
  group: lomenti-vps-deploy
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: lomenti-installer
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decrypt private deployment and test in independent environment
        env:
          VPS_CIPHERTEXT: 
        run: |
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib,resource,shutil,subprocess,sys,tarfile
          base=pathlib.Path.home()/'lomenti-deploy'
          source=base/'source'
          os.umask(0o077)
          source.mkdir(mode=0o700,exist_ok=True)
          encrypted=base/'payload.cms'
          encrypted.write_bytes(base64.b64decode(os.environ['VPS_CIPHERTEXT'],validate=True))
          archive=base/'payload.tar.gz'
          result=subprocess.run(['openssl','cms','-decrypt','-binary','-inform','DER','-in',str(encrypted),'-recip',str(base/'recipient.pem'),'-inkey',str(base/'recipient.key'),'-out',str(archive)],capture_output=True)
          if result.returncode: raise SystemExit('VPS_DECRYPT_FAILED')
          with tarfile.open(archive,'r:gz') as bundle:
              for member in bundle.getmembers():
                  if not member.isfile() or member.name.startswith('/') or '..' in pathlib.PurePosixPath(member.name).parts:
                      raise SystemExit('UNSAFE_BUNDLE')
              bundle.extractall(source)
          archive.unlink()
          shutil.copy2('lomenti-installer/ops/lomenti/install_system.py',base/'install_system.py')
          config=json.loads((source/'credentials.json').read_text())
          env=dict(os.environ,**config,BATCH_SIZE='20',PYTHONDONTWRITEBYTECODE='1')
          env.pop('VPS_CIPHERTEXT',None)
          python=source/'.venv/bin/python'
          def step(name,args,limit=False):
              with (base/(name+'.log')).open('wb') as output:
                  def limits():
                      os.nice(10)
                      resource.setrlimit(resource.RLIMIT_AS,(384*1024*1024,384*1024*1024))
                  result=subprocess.run(args,cwd=source,env=env,stdout=output,stderr=subprocess.STDOUT,
                      timeout=1800,preexec_fn=limits if limit else None)
              print(name+': '+('PASS' if result.returncode==0 else 'FAIL'),flush=True)
              if result.returncode: raise SystemExit('STAGING_FAILED: '+name)
          if not (source/'.venv/bin/pip').exists(): step('venv',[sys.executable,'-m','venv',str(source/'.venv')])
          step('dependencies',[str(python),'-m','pip','install','--disable-pip-version-check','-q','-r','requirements.txt'])
          step('unit_tests',[str(python),'-m','unittest','-v','test_verification'])
          step('collector_test',[str(python),'collector.py'],True)
          step('eligibility_test',[str(python),'call_eligibility.py'],True)
          report=json.loads((source/'artifacts/verification.json').read_text())
          assert (source/'artifacts/call_eligibility_review.csv').is_file()
          proof={'success':True,'run_id':report['run_id'],'processed':len(report['results']),
                 'tested_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                 'installer_sha256':hashlib.sha256((base/'install_system.py').read_bytes()).hexdigest()}
          (base/'preflight.json').write_text(json.dumps(proof))
          print(json.dumps(proof))
          print('ADMIN_ACTION_REQUIRED: sudo python3 /home/runner/lomenti-deploy/install_system.py')
          PY
