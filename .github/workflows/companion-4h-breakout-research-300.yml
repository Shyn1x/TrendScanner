name: Companion 4H Breakout $300 (Research Only)
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/companion_4h_breakout_research_300.py
      - artifacts/trendscanner/test_companion_4h_breakout_research_300.py
      - .github/workflows/companion-4h-breakout-research-300.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 120
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate breakout causality, independent ownership guard and risk math
        shell: bash
        run: |
          python3 -m py_compile artifacts/trendscanner/companion_4h_breakout_research_300.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_companion_4h_breakout_research_300.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_rsi2_exit_risk_fee_capped_300.py
          python3 -m unittest discover -s artifacts/trendscanner -p test_strategy_conflict_guard.py -v
      - name: Independent 4H event-only breakout backtest and unchanged daily RSI2 benchmark
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/companion_4h_breakout_research_300.py > companion-4h-breakout-300.json
      - name: Publish results in research-only branch
        shell: bash
        run: |
          set -euo pipefail
          python3 artifacts/trendscanner/publish_rsi2_report.py companion-4h-breakout-300.json \
            --json-out artifacts/trendscanner/reports/companion_4h_breakout_latest.json \
            --md-out artifacts/trendscanner/reports/companion_4h_breakout_latest.md \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat artifacts/trendscanner/reports/companion_4h_breakout_latest.md >> "${GITHUB_STEP_SUMMARY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trendscanner/reports/companion_4h_breakout_latest.json artifacts/trendscanner/reports/companion_4h_breakout_latest.md
          if ! git diff --cached --quiet; then
            git commit -m "research: latest independent companion 4H breakout results [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Retain full detailed trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-4h-breakout-300
          path: companion-4h-breakout-300.json
          if-no-files-found: warn
          retention-days: 30
