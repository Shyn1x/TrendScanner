name: Lomenti eligibility audit and staging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lomenti-eligibility.yml]
permissions:
  contents: read
concurrency:
  group: lomenti-vps-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: lomenti-installer
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Test latest source and audit confirmed contacts privately
        env:
          VPS_CIPHERTEXT: 
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,resource,shutil,subprocess,tarfile
          os.umask(0o077)
          base=pathlib.Path.home()/'lomenti-eligibility-update'
          base.mkdir(mode=0o700,exist_ok=True)
          source=base/'source';source.mkdir(mode=0o700,exist_ok=True)
          old=pathlib.Path.home()/'lomenti-deploy'
          encrypted=base/'payload.cms';encrypted.write_bytes(base64.b64decode(os.environ['VPS_CIPHERTEXT'],validate=True))
          archive=base/'payload.tar.gz'
          result=subprocess.run(['openssl','cms','-decrypt','-binary','-inform','DER','-in',str(encrypted),'-recip',str(old/'recipient.pem'),'-inkey',str(old/'recipient.key'),'-out',str(archive)],capture_output=True)
          if result.returncode: raise SystemExit('DECRYPT_FAILED')
          with tarfile.open(archive,'r:gz') as bundle:
              if any(not m.isfile() or m.name.startswith('/') or '..' in pathlib.PurePosixPath(m.name).parts for m in bundle.getmembers()):
                  raise SystemExit('UNSAFE_PACKAGE')
              bundle.extractall(source)
          archive.unlink()
          shutil.copy2('lomenti-installer/ops/lomenti/update_eligibility.py',base/'update_eligibility.py')
          env=dict(os.environ,**json.loads((source/'credentials.json').read_text()))
          env.pop('VPS_CIPHERTEXT',None)
          uv=shutil.which('uv');python=source/'.venv/bin/python'
          def step(name,command,seconds=1800):
              def limits():
                  os.nice(10)
                  resource.setrlimit(resource.RLIMIT_AS,(384*1024*1024,384*1024*1024))
              with (base/(name+'.log')).open('wb') as output:
                  result=subprocess.run(command,cwd=source,env=env,stdout=output,stderr=subprocess.STDOUT,timeout=seconds,preexec_fn=limits)
              print(name+': '+('PASS' if result.returncode==0 else 'FAIL'),flush=True)
              if result.returncode: raise SystemExit('PREFLIGHT_FAILED: '+name)
          step('venv',[uv,'venv','--python','/usr/bin/python3','--clear',str(source/'.venv')])
          step('dependencies',[uv,'pip','install','--python',str(python),'-q','-r','requirements.txt'])
          step('all_tests',[str(python),'-m','unittest','discover','-v'])
          step('full_audit',[str(python),'call_eligibility.py','--enrich'])
          result=json.loads((source/'artifacts/call_eligibility_v3.json').read_text())
          proof={'success':True,'run_id':result['run_id'],'counts':result['counts'],'processed':len(result['results']),
                 'sha256':hashlib.sha256((source/'call_eligibility.py').read_bytes()).hexdigest()}
          (base/'preflight.json').write_text(json.dumps(proof))
          print(json.dumps(proof),flush=True)
          print('ADMIN_ACTION: sudo python3 /home/runner/lomenti-eligibility-update/update_eligibility.py')
          PY
