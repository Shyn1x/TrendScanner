name: RSI2 LONG Loss Attribution Research
on:
  push:
    branches: [research/rsi2-long-loss-attribution]
    paths:
      - artifacts/trendscanner/rsi2_long_loss_attribution.py
      - artifacts/trendscanner/test_rsi2_long_loss_attribution.py
      - .github/workflows/rsi2-long-loss-attribution.yml
permissions:
  contents: read
jobs:
  research-only:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Verify ledger parity and fee attribution
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_rsi2_long_loss_attribution.py -v
      - name: Diagnose historical LONG trades without changes to live Demo
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_long_loss_attribution.py | tee long-loss-attribution.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: long-loss-attribution
          path: long-loss-attribution.json
          retention-days: 30
