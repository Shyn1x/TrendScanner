name: RSI2 Pre-entry Filters Research
on:
  push:
    branches: [research/rsi2-preentry-filters]
    paths:
      - artifacts/trendscanner/rsi2_preentry_filters.py
      - artifacts/trendscanner/test_rsi2_preentry_filters.py
      - .github/workflows/rsi2-preentry-filters.yml
permissions:
  contents: read
jobs:
  research-only:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Verify filters and original parity
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_rsi2_preentry_filters.py -v
      - name: Compare preregistered single filters and combination
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_preentry_filters.py | tee preentry-filter-results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rsi2-preentry-filter-results
          path: preentry-filter-results.json
          retention-days: 30
