name: RSI2 + 4H Shared Portfolio ($300 Research Only)
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/rsi2_companion_shared_portfolio_300.py
      - artifacts/trendscanner/test_rsi2_companion_shared_portfolio_300.py
      - artifacts/trendscanner/publish_shared_portfolio_report.py
      - .github/workflows/rsi2-companion-shared-portfolio-300.yml
permissions:
  contents: write
jobs:
  replay:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 120
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tests on synthetic multi-strategy positions and risk caps
        shell: bash
        run: |
          python3 -m py_compile artifacts/trendscanner/rsi2_companion_shared_portfolio_300.py artifacts/trendscanner/publish_shared_portfolio_report.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_rsi2_companion_shared_portfolio_300.py -v
          python3 -m unittest discover -s artifacts/trendscanner -p test_strategy_conflict_guard.py -v
      - name: Replay same account RSI2 alone breakout alone and combined
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_companion_shared_portfolio_300.py > rsi2-shared-portfolio-300-full.json
      - name: Summarize and publish results directly into research branch
        shell: bash
        run: |
          set -euo pipefail
          python3 artifacts/trendscanner/publish_shared_portfolio_report.py rsi2-shared-portfolio-300-full.json \
            --json-out artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.json \
            --md-out artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.md \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.md >> "${GITHUB_STEP_SUMMARY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A parallel research workflow may have advanced the branch during
          # the 8-minute backtest. Save outputs and publish atop current origin.
          cp artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.json "${RUNNER_TEMP}/shared-portfolio-latest.json"
          cp artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.md "${RUNNER_TEMP}/shared-portfolio-latest.md"
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            mkdir -p artifacts/trendscanner/reports
            cp "${RUNNER_TEMP}/shared-portfolio-latest.json" artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.json
            cp "${RUNNER_TEMP}/shared-portfolio-latest.md" artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.md
            git add artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.json artifacts/trendscanner/reports/rsi2_shared_portfolio_latest.md
            if git diff --cached --quiet; then
              echo "Report already published."
              break
            fi
            git commit -m "research: latest RSI2 plus 4H shared portfolio comparison [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Published report successfully."
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Failed to publish after four attempts." >&2
              exit 1
            fi
            sleep 3
          done
      - name: Preserve full per-position ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi2-shared-portfolio-300
          path: rsi2-shared-portfolio-300-full.json
          retention-days: 30
          if-no-files-found: warn
