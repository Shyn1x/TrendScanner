name: Prospective Lower TF Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout frozen lower-TF research code
        uses: actions/checkout@v4
        with:
          ref: cc5697f89908f8da8097424ab1f5f1cab2491fa8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile lower-TF collector
        env:
          PYTHONPATH: artifacts/trendscanner
        run: |
          uv run python -m py_compile artifacts/trendscanner/lower_tf_storage.py
          uv run python -m py_compile artifacts/trendscanner/lower_tf_shadow.py
          uv run python -m py_compile artifacts/trendscanner/lower_tf_coverage.py
          uv run python -m py_compile artifacts/trendscanner/prospective_lower_tf_collector.py

      - name: Run lower-TF unit tests
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run --with pytest pytest -q artifacts/trendscanner/test_lower_tf_storage.py artifacts/trendscanner/test_lower_tf_shadow.py

      - name: Dry-run 1h
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe 1h

      - name: Dry-run 15m
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe 15m

      - name: Write 1h baseline/state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe 1h --write

      - name: Write 15m baseline/state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe 15m --write
