name: Prospective Lower TF Collector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5547e881078dc97ccb317b5e4f8252eab3fb9a21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Verify ETC historical gaps with independent public API queries
        env:
          PYTHONPATH: artifacts/trendscanner
        run: |
          uv run python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone
          import prospective_lower_tf_collector as c
          from scanner import exchange
          target = 1791028800000
          for symbol, tf, t, count in [
              ("ETC/USDT", "15m", target, 1),
              ("ETC/USDT", "15m", 1791018900000 + 63 * 900000, 64),
              ("ETC/USDT", "15m", c._latest_closed_timestamp(exchange.milliseconds(), "15m"), 1),
              ("BTC/USDT", "15m", target, 1),
          ]:
              source = c._fetch_source_for_targets(symbol, tf, t, count)
              check_target = target if count == 64 else t
              first = check_target - (c.CLOSED_BARS - 1) * c.TIMEFRAME_MS[tf]
              expected = set(range(first, check_target + c.TIMEFRAME_MS[tf], c.TIMEFRAME_MS[tf]))
              missing = sorted(expected - set(source["time"]))
              window = c._build_window_for_target(source, tf, check_target)
              print(json.dumps({"symbol":symbol, "tf":tf, "fetch_target":t, "checked_target":check_target, "target_count":count, "source_rows":len(source), "missing":missing, "window_rows":len(window)}, sort_keys=True), flush=True)
              if symbol == "ETC/USDT" and t == target:
                  for stamp in missing:
                      params = {"symbol":"ETCUSDTM", "granularity":15, "from":stamp-900000, "to":stamp+900000}
                      url = "https://api-futures.kucoin.com/api/v1/kline/query?" + urllib.parse.urlencode(params)
                      with urllib.request.urlopen(url, timeout=25) as response:
                          payload = json.load(response)
                      if payload.get("code") != "200000":
                          raise RuntimeError("KuCoin public query failed: " + str(payload.get("code")))
                      rows = payload.get("data", [])
                      returned = sorted(int(row[0]) for row in rows)
                      print(json.dumps({"narrow_probe":stamp, "utc":datetime.fromtimestamp(stamp/1000, timezone.utc).isoformat(), "returned_timestamps":returned, "target_returned":stamp in returned}), flush=True)
          print("READ-ONLY CANDLE DIAGNOSTICS: PASS", flush=True)
          PY
