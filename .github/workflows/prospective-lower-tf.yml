name: Prospective Lower TF Collector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5547e881078dc97ccb317b5e4f8252eab3fb9a21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Inspect ETC candle source without writes
        env:
          PYTHONPATH: artifacts/trendscanner
        run: |
          uv run python - <<'PY'
          import json
          import prospective_lower_tf_collector as c
          from scanner import exchange
          for symbol, tf, target in [
              ("ETC/USDT", "15m", 1791189900000),
              ("ETC/USDT", "15m", c._latest_closed_timestamp(exchange.milliseconds(), "15m")),
              ("ETC/USDT", "1h", c._latest_closed_timestamp(exchange.milliseconds(), "1h")),
              ("BTC/USDT", "15m", 1791189900000),
          ]:
              source = c._fetch_source_for_targets(symbol, tf, target, 1)
              first = target - (c.CLOSED_BARS - 1) * c.TIMEFRAME_MS[tf]
              missing = sorted(set(range(first, target + c.TIMEFRAME_MS[tf], c.TIMEFRAME_MS[tf])) - set(source["time"]))
              window = c._build_window_for_target(source, tf, target)
              print(json.dumps({"symbol": symbol, "timeframe": tf, "target": target, "source_rows": len(source), "first": None if source.empty else int(source.iloc[0]["time"]), "last": None if source.empty else int(source.iloc[-1]["time"]), "missing_count":len(missing), "missing":missing, "window_rows":len(window)}, sort_keys=True), flush=True)
          print("CANDLE DIAGNOSTICS: PASS")
          PY
