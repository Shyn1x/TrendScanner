name: Prospective Lower TF Collector

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Write validated candles to Neon (manual runs default to dry-run)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "7,12 * * * *"
    - cron: "22,27,37,42,52,57 * * * *"

  pull_request:
    branches: [main]
    paths:
      - "artifacts/trendscanner/prospective_market_data.py"
      - "artifacts/trendscanner/test_prospective_market_data.py"
      - "artifacts/trendscanner/prospective_lower_tf_collector.py"
      - "artifacts/trendscanner/lower_tf_shadow.py"
      - ".github/workflows/prospective-lower-tf.yml"

permissions:
  contents: read

concurrency:
  group: prospective-lower-tf-collector
  cancel-in-progress: false

env:
  TREND_SCANNER_MARKET_SOURCE: bybit_linear

jobs:
  validate-and-collect:
    if: github.event_name != 'pull_request'
    name: Collect ${{ matrix.timeframe }}
    strategy:
      # A rejected 15m source must not cancel an independently valid 1h batch.
      fail-fast: false
      matrix:
        timeframe: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event.schedule == '7,12 * * * *') && '["1h","15m"]' || '["15m"]') }}
    runs-on: [self-hosted, linux, x64, bybit-demo]
    defaults:
      run:
        working-directory: frozen
    timeout-minutes: 40

    steps:
      - name: Checkout frozen lower-TF research code
        uses: actions/checkout@v4
        with:
          ref: 5547e881078dc97ccb317b5e4f8252eab3fb9a21
          path: frozen

      - name: Checkout venue adapter
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patch

      - name: Assemble prospective Bybit workspace
        working-directory: .
        run: |
          cp patch/artifacts/trendscanner/prospective_market_data.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/lower_tf_shadow.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/prospective_lower_tf_collector.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/test_prospective_market_data.py frozen/artifacts/trendscanner/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: frozen

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile lower-TF collector
        env:
          PYTHONPATH: artifacts/trendscanner
        run: |
          uv run python -m py_compile artifacts/trendscanner/lower_tf_storage.py
          uv run python -m py_compile artifacts/trendscanner/lower_tf_shadow.py
          uv run python -m py_compile artifacts/trendscanner/lower_tf_coverage.py
          uv run python -m py_compile artifacts/trendscanner/prospective_lower_tf_collector.py

      - name: Run lower-TF unit tests
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run --with pytest pytest -q artifacts/trendscanner/test_lower_tf_storage.py artifacts/trendscanner/test_lower_tf_shadow.py artifacts/trendscanner/test_prospective_lower_tf_collector.py artifacts/trendscanner/test_prospective_market_data.py

      - name: Dry-run ${{ matrix.timeframe }}
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe ${{ matrix.timeframe }}

      - name: Write ${{ matrix.timeframe }} baseline/state
        if: github.event_name == 'schedule' || inputs.write
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe ${{ matrix.timeframe }} --write

  validate-adapter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5547e881078dc97ccb317b5e4f8252eab3fb9a21
          path: frozen
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: patch
      - name: Assemble and test market adapter
        run: |
          cp patch/artifacts/trendscanner/prospective_market_data.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/test_prospective_market_data.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/lower_tf_shadow.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/prospective_lower_tf_collector.py frozen/artifacts/trendscanner/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: frozen
      - name: Check venue routing and signal integrity
        working-directory: frozen
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run --with pytest pytest -q artifacts/trendscanner/test_prospective_market_data.py artifacts/trendscanner/test_lower_tf_storage.py artifacts/trendscanner/test_lower_tf_shadow.py artifacts/trendscanner/test_prospective_lower_tf_collector.py
