name: Prospective Lower TF Collector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-candles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5547e881078dc97ccb317b5e4f8252eab3fb9a21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Inspect ETC candle source without writes
        env:
          PYTHONPATH: artifacts/trendscanner
        run: |
          uv run python - <<'PY'
          import json
          import prospective_lower_tf_collector as c
          from scanner import exchange
          from scanner import _to_futures_symbol
          target = 1791189900000
          source = c._fetch_source_for_targets("ETC/USDT", "15m", target, 1)
          step = c.TIMEFRAME_MS["15m"]
          missing = sorted(set(range(target-198*step, target+step, step))-set(source["time"]))
          for timestamp in missing:
              direct = exchange.fetch_ohlcv(_to_futures_symbol("ETC/USDT"), "15m", since=timestamp, limit=1)
              minutes = exchange.fetch_ohlcv(_to_futures_symbol("ETC/USDT"), "1m", since=timestamp, limit=15)
              direct = [row for row in direct if row[0] == timestamp]
              minutes = [row for row in minutes if timestamp <= row[0] < timestamp+step]
              print(json.dumps({"timestamp":timestamp, "direct":direct, "minute_count":len(minutes), "minute_volume":sum(row[5] for row in minutes)},sort_keys=True),flush=True)
          print("NARROW SOURCE DIAGNOSTICS: PASS")
          PY
      - name: Validate all current 1h symbols without writes
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_lower_tf_collector.py --timeframe 1h
