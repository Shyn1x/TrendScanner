name: Multi Strategy Batch RSI2 and 4H ($300 Research Only)
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/multi_strategy_batch_300.py
      - artifacts/trendscanner/test_multi_strategy_batch_300.py
      - artifacts/trendscanner/publish_multi_strategy_batch.py
      - .github/workflows/multi-strategy-batch-300.yml
permissions:
  contents: write
concurrency:
  group: multi-strategy-batch-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 120
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Preflight all strategy families and ownership checks
        shell: bash
        run: |
          python3 -m py_compile artifacts/trendscanner/multi_strategy_batch_300.py artifacts/trendscanner/publish_multi_strategy_batch.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_multi_strategy_batch_300.py -v
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_rsi2_companion_shared_portfolio_300.py -v
          python3 -m unittest discover -s artifacts/trendscanner -p test_strategy_conflict_guard.py -v
      - name: Fetch one fixed Bybit history and replay all 43 scenarios
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/multi_strategy_batch_300.py > multi-strategy-batch-300-full.json
      - name: Publish complete ranked matrix in GitHub and report files
        shell: bash
        run: |
          set -euo pipefail
          python3 artifacts/trendscanner/publish_multi_strategy_batch.py multi-strategy-batch-300-full.json \
            --json-out artifacts/trendscanner/reports/multi_strategy_batch_latest.json \
            --md-out artifacts/trendscanner/reports/multi_strategy_batch_latest.md \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat artifacts/trendscanner/reports/multi_strategy_batch_latest.md >> "${GITHUB_STEP_SUMMARY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp artifacts/trendscanner/reports/multi_strategy_batch_latest.md "${RUNNER_TEMP}/multi_strategy_batch_latest.md"
          cp artifacts/trendscanner/reports/multi_strategy_batch_latest.json "${RUNNER_TEMP}/multi_strategy_batch_latest.json"
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            mkdir -p artifacts/trendscanner/reports
            cp "${RUNNER_TEMP}/multi_strategy_batch_latest.md" artifacts/trendscanner/reports/multi_strategy_batch_latest.md
            cp "${RUNNER_TEMP}/multi_strategy_batch_latest.json" artifacts/trendscanner/reports/multi_strategy_batch_latest.json
            git add artifacts/trendscanner/reports/multi_strategy_batch_latest.md artifacts/trendscanner/reports/multi_strategy_batch_latest.json
            if git diff --cached --quiet; then break; fi
            git commit -m "research: latest 43-case multi-strategy batch [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            if [ "${attempt}" = 4 ]; then exit 1; fi
            sleep 3
          done
      - name: Archive trade ledger and all 43 cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-strategy-batch-300
          path: multi-strategy-batch-300-full.json
          if-no-files-found: warn
          retention-days: 30
