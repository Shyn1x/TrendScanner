name: TrendRider Original Author Rules (Freqtrade Native)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trendrider-original-native-backtest.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trendrider-original-native-research
  cancel-in-progress: false
jobs:
  native-backtest:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rsi2-long-leverage-5x-10x
      - name: Prepare vendored public TrendRider and record source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-test/strategies native-test/results
          cp artifacts/trendscanner/vendor/TrendRiderStrategy_public.py native-test/strategies/
          echo "Vendored strategy SHA256: $(sha256sum native-test/strategies/TrendRiderStrategy_public.py)"
          echo "Source: darkvolg/Trading FreqtradeBot/user_data/strategies/TrendRiderStrategy_public.py"
          echo "Original Git blob SHA: b7d013a802b45d2dd1cb0b91d4083fb247efac75"
          cp artifacts/trendscanner/trendrider_original_freqtrade_config.json native-test/config.json
          {
            echo "Original upstream repository: https://github.com/darkvolg/Trading"
            echo "Upstream pinned blob SHA: b7d013a802b45d2dd1cb0b91d4083fb247efac75"
            echo "Upstream strategy blob SHA256: $(sha256sum native-test/strategies/TrendRiderStrategy_public.py)"
            echo "Exact Python original: TrendRiderStrategyPublic, no entry/exit alterations"
            echo "Original base candle: 1h (strategy-controlled)"
            echo "Original informative candles: 4h / 1d / BTC 1h"
            echo "USDT perpetuals: Bybit, original published 13-symbol whitelist"
            echo "Research portfolio: 300 USDT (differs from developer's public 500 USDT)"
            echo "Config constructed for independent test; original config.json absent in public checkout"\n            echo "Runtime: Freqtrade 2026.2 installed with uv Python 3.12; no Docker on runner"
            echo "Selection: no parameter optimization; Freqtrade default strategy parameters"
            echo "Window: 2026-01-04 to 2026-11-17, historical warmup downloaded from 2025-04-01"
            echo "This test DOES NOT duplicate author's unpublished exchange configuration or paper-trade ledger."
          } | tee native-test/results/provenance.txt
      - uses: astral-sh/setup-uv@v6
      - name: Prepare reproducible Freqtrade 2026 environment without Docker
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          mkdir -p native-test/data native-test/results
          uv run --no-project --python 3.12 --with "freqtrade==2026.2" freqtrade --version
      - name: Check native strategy and configuration
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 --with "freqtrade==2026.2" freqtrade list-strategies \
            --userdir "${PWD}/native-test" --strategy-path "${PWD}/native-test/strategies" \
            --config "${PWD}/native-test/config.json"
      - name: Download Bybit futures data (1h, 4h, 1d)
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 --with "freqtrade==2026.2" freqtrade download-data \
            --userdir "${PWD}/native-test" --config "${PWD}/native-test/config.json" \
            --trading-mode futures --timeframes 1h 4h 1d --timerange 20250401-20261118 \
            --pairs BTC/USDT:USDT ETH/USDT:USDT SOL/USDT:USDT DOGE/USDT:USDT \
              XRP/USDT:USDT ADA/USDT:USDT AVAX/USDT:USDT DOT/USDT:USDT \
              POL/USDT:USDT NEAR/USDT:USDT ATOM/USDT:USDT SUI/USDT:USDT OP/USDT:USDT
      - name: Native backtest - unchanged author's original entry and exit, 1x leverage
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 --with "freqtrade==2026.2" freqtrade backtesting \
            --userdir "${PWD}/native-test" --config "${PWD}/native-test/config.json" \
            --strategy TrendRiderStrategyPublic \
            --strategy-path "${PWD}/native-test/strategies" \
            --timerange 20260104-20261117 --fee 0.0006 \
            --export trades --export-filename "${PWD}/native-test/results/trendrider_original_1h.json" \
            2>&1 | tee native-test/results/native_backtest.log
      - name: Always archive data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendrider-original-native-backtest
          path: |
            native-test/results/
            native-test/strategies/TrendRiderStrategy_public.py
            native-test/config.json
          if-no-files-found: warn
          retention-days: 30
