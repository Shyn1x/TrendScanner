name: RSI2 LONG Leverage 5x 10x Risk Research
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/rsi2_long_leverage_sensitivity.py
      - artifacts/trendscanner/test_rsi2_long_leverage_sensitivity.py
      - .github/workflows/rsi2-long-leverage-sensitivity.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Validate baseline parity, margin breach and funding fee impacts
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_rsi2_long_leverage_sensitivity.py -v
      - name: Recalculate leveraged position sizes and stress liquidations
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_long_leverage_sensitivity.py | tee rsi2-long-leverage-results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rsi2-long-leverage-results
          path: rsi2-long-leverage-results.json
          retention-days: 30
