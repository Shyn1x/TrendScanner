name: RSI2 Daily 3R Robustness ($300; read-only)
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/rsi2_daily_3r_robustness_300.py
      - .github/workflows/rsi2-daily-3r-robustness-300.yml
permissions:
  contents: write
jobs:
  robustness:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 90
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Compile scripts and check RSI2 research mathematics
        shell: bash
        run: |
          python3 -m py_compile artifacts/trendscanner/rsi2_daily_3r_robustness_300.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_rsi2_daily_3r_sensitivity_300.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_rsi2_exit_risk_fee_capped_300.py
      - name: Compare shortlist under double fees and increased slots
        shell: bash
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_daily_3r_robustness_300.py > rsi2-daily-3r-robustness-300-results.json
      - name: Publish report for direct reading
        shell: bash
        run: |
          set -euo pipefail
          python3 artifacts/trendscanner/publish_rsi2_report.py rsi2-daily-3r-robustness-300-results.json \
            --json-out artifacts/trendscanner/reports/rsi2_daily_3r_robustness_latest.json \
            --md-out artifacts/trendscanner/reports/rsi2_daily_3r_robustness_latest.md \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat artifacts/trendscanner/reports/rsi2_daily_3r_robustness_latest.md >> "${GITHUB_STEP_SUMMARY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trendscanner/reports/rsi2_daily_3r_robustness_latest.json artifacts/trendscanner/reports/rsi2_daily_3r_robustness_latest.md
          if ! git diff --cached --quiet; then
            git commit -m "research: latest RSI2 fee stress robustness [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload full artifact for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi2-daily-3r-robustness-300
          path: rsi2-daily-3r-robustness-300-results.json
          retention-days: 30
          if-no-files-found: warn
