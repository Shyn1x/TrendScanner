name: RSI2 Exit Risk Fee-Capped $300 Research
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/rsi2_exit_risk_fee_capped_300.py
      - artifacts/trendscanner/test_rsi2_exit_risk_fee_capped_300.py
      - artifacts/trendscanner/publish_rsi2_report.py
      - .github/workflows/rsi2-exit-risk-fee-capped-300.yml
permissions:
  contents: write
jobs:
  compare:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 90
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate fee-inclusive risk and add sizing before fetching market data
        shell: bash
        run: |
          python3 -m py_compile artifacts/trendscanner/rsi2_exit_risk_fee_capped_300.py
          uv run --no-project --with pandas python -m unittest artifacts/trendscanner/test_rsi2_exit_risk_fee_capped_300.py
      - name: Replay RSI2 2R/3R/partial with fee-capped add risk
        shell: bash
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_exit_risk_fee_capped_300.py | tee rsi2-exit-risk-fee-capped-300-results.json
      - name: Build human-readable and machine-readable report
        shell: bash
        run: |
          python3 artifacts/trendscanner/publish_rsi2_report.py rsi2-exit-risk-fee-capped-300-results.json \
            --json-out artifacts/trendscanner/reports/rsi2_exit_risk_latest.json \
            --md-out artifacts/trendscanner/reports/rsi2_exit_risk_latest.md \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat artifacts/trendscanner/reports/rsi2_exit_risk_latest.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish latest compact report to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trendscanner/reports/rsi2_exit_risk_latest.json artifacts/trendscanner/reports/rsi2_exit_risk_latest.md
          if ! git diff --cached --quiet; then
            git commit -m "research: update latest fee-capped RSI2 report [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi2-exit-risk-fee-capped-300-results
          path: rsi2-exit-risk-fee-capped-300-results.json
          if-no-files-found: warn
          retention-days: 30
