name: Bybit Orderflow Replay - 15 Minute Diagnostic
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/bybit_orderflow_replay.py
      - .github/workflows/bybit-orderflow-replay.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bybit-orderflow-replay
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable 15-minute market-data artifact from successful run 45600636674
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, pathlib, urllib.request, zipfile
          url="https://api.github.com/repos/Shyn1x/TrendScanner/actions/artifacts/15017115657/zip"
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"TrendScanner-Offline-Orderflow-Research"})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=r.read()
          archive=zipfile.ZipFile(io.BytesIO(data))
          names=[n for n in archive.namelist() if n.endswith("bybit_raw_orderflow.jsonl.gz")]
          if len(names)!=1:raise SystemExit("CAPTURE_DATA_NOT_FOUND")
          dest=pathlib.Path("orderflow-data/bybit_raw_orderflow.jsonl.gz")
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(archive.read(names[0]))
          print("Downloaded historical raw websocket capture:",dest, "compressed bytes:",dest.stat().st_size)
          PY
      - name: Compile and replay both long-only orderflow signal styles, 1s/2s execution delays
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile artifacts/trendscanner/bybit_orderflow_replay.py
          python3 artifacts/trendscanner/bybit_orderflow_replay.py \
            orderflow-data/bybit_raw_orderflow.jsonl.gz \
            --json-out artifacts/trendscanner/reports/bybit_orderflow_diagnostic_latest.json \
            --md-out artifacts/trendscanner/reports/bybit_orderflow_diagnostic_latest.md
          cat artifacts/trendscanner/reports/bybit_orderflow_diagnostic_latest.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Archive analysis, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-orderflow-diagnostic-report
          path: artifacts/trendscanner/reports/bybit_orderflow_diagnostic_latest.*
          if-no-files-found: warn
          retention-days: 30
