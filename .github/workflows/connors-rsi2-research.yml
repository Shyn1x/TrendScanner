name: Connors RSI2 Mean Reversion Research
on:
  push:
    branches: [research/connors-rsi2-mean-reversion]
    paths:
      - artifacts/trendscanner/connors_rsi2_research.py
      - artifacts/trendscanner/test_connors_rsi2_research.py
      - .github/workflows/connors-rsi2-research.yml
permissions:
  contents: read
jobs:
  research-only:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Test timing and fees
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_connors_rsi2_research.py -v
      - name: Run historical research (public Bybit data)
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/connors_rsi2_research.py | tee connors-rsi2-result.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connors-rsi2-results
          path: connors-rsi2-result.json
          retention-days: 30
