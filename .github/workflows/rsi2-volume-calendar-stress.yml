name: RSI2 LONG Volume Calendar Crash Audit
on:
  push:
    branches: [research/rsi2-volume-calendar-crash-check]
    paths:
      - artifacts/trendscanner/rsi2_volume_calendar_stress.py
      - artifacts/trendscanner/test_rsi2_volume_calendar_stress.py
      - .github/workflows/rsi2-volume-calendar-stress.yml
permissions:
  contents: read
jobs:
  research-only:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Validate parity and yearly equity aggregation
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_rsi2_volume_calendar_stress.py -v
      - name: Read-only replay by calendar year and BTC crash windows
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_volume_calendar_stress.py | tee rsi2-volume-calendar-stress-results.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rsi2-volume-calendar-stress-results
          path: rsi2-volume-calendar-stress-results.json
          retention-days: 30
