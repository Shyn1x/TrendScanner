name: Cron Scheduler Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "13,28,43,58 * * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
