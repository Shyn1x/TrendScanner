name: Prospective 4h Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: 69cb70107baecf0e9b8dc3a0731fa885a338d2ef

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run prospective integrity tests
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python -m unittest artifacts/trendscanner/test_prospective_integrity.py

      - name: Dry-run prospective collector
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_collector.py

      - name: Run prospective collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_collector.py --write
