name: Prospective 4h Collector

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Write validated Bybit observations to Neon"
        type: boolean
        default: false
  schedule:
    - cron: "15 */4 * * *"

  pull_request:
    branches: [main]
    paths:
      - "artifacts/trendscanner/prospective_market_data.py"
      - "artifacts/trendscanner/market_regime_shadow_v2.py"
      - "artifacts/trendscanner/prospective_4h_v2_collector.py"
      - "artifacts/trendscanner/test_prospective_4h_v2.py"
      - ".github/workflows/prospective-4h.yml"

permissions:
  contents: read

concurrency:
  group: prospective-4h-collector
  cancel-in-progress: false

env:
  TREND_SCANNER_MARKET_SOURCE: bybit_linear

jobs:
  collect:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30

    steps:
      - name: Checkout frozen 4h research base
        uses: actions/checkout@v4
        with:
          ref: 69cb70107baecf0e9b8dc3a0731fa885a338d2ef
          path: frozen

      - name: Checkout sequential v2 patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patch

      - name: Assemble frozen 4h v2 workspace
        run: |
          cp patch/artifacts/trendscanner/prospective_market_data.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/market_regime_shadow_v2.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/prospective_4h_v2_coverage.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/prospective_4h_v2_collector.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/test_prospective_4h_v2.py frozen/artifacts/trendscanner/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: frozen

      - name: Install dependencies
        working-directory: frozen
        run: uv sync --frozen

      - name: Verify sequential 4h imports
        working-directory: frozen
        env:
          PYTHONPATH: artifacts/trendscanner
        run: >-
          uv run python -c "import market_regime_shadow, market_regime_shadow_v2, prospective_coverage, prospective_4h_v2_coverage, prospective_4h_v2_collector, shadow_storage; print('4h imports: PASS')"

      - name: Run frozen 4h integrity tests
        working-directory: frozen
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/test_prospective_integrity.py

      - name: Run sequential 4h tests
        working-directory: frozen
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/test_prospective_4h_v2.py

      - name: Dry-run sequential 4h collector
        working-directory: frozen
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_4h_v2_collector.py

      - name: Run sequential 4h collector
        if: github.event_name == 'schedule' || inputs.write
        working-directory: frozen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_4h_v2_collector.py --write

  validate-4h:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69cb70107baecf0e9b8dc3a0731fa885a338d2ef
          path: frozen
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: patch
      - name: Assemble 4h Bybit workspace
        run: |
          cp patch/artifacts/trendscanner/prospective_market_data.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/market_regime_shadow_v2.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/prospective_4h_v2_coverage.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/prospective_4h_v2_collector.py frozen/artifacts/trendscanner/
          cp patch/artifacts/trendscanner/test_prospective_4h_v2.py frozen/artifacts/trendscanner/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: frozen
      - name: Check 4h context and signal integrity
        working-directory: frozen
        env:
          PYTHONPATH: artifacts/trendscanner
        run: |
          uv run python artifacts/trendscanner/test_prospective_integrity.py
          uv run python artifacts/trendscanner/test_prospective_4h_v2.py
