name: Prospective 4h Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
        with:
          ref: 9d5c84fd7329b325c0c3d0bd14bb70f2773e9c29

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run prospective collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_collector.py --write
