name: Prospective 4h Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: read

concurrency:
  group: prospective-4h-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run legacy prospective integrity tests
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/test_prospective_integrity.py

      - name: Run sequential 4h tests
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/test_prospective_4h_v2.py

      - name: Dry-run sequential 4h collector
        env:
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_4h_v2_collector.py

      - name: Run sequential 4h collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: artifacts/trendscanner
        run: uv run python artifacts/trendscanner/prospective_4h_v2_collector.py --write
