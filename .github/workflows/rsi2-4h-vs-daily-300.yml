name: RSI2 4H vs Daily $300 Cross Research
on:
  push:
    branches: [research/rsi2-long-leverage-5x-10x]
    paths:
      - artifacts/trendscanner/rsi2_4h_vs_daily_300.py
      - .github/workflows/rsi2-4h-vs-daily-300.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 90
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Syntax check (no orders)
        run: python3 -m py_compile artifacts/trendscanner/rsi2_4h_vs_daily_300.py
      - name: Simulate 1D and 4H RSI2 on 100 crypto perps
        shell: bash
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_4h_vs_daily_300.py | tee rsi2-4h-vs-daily-300-results.json
      - name: Upload comparison data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi2-4h-vs-daily-300-results
          path: rsi2-4h-vs-daily-300-results.json
          if-no-files-found: warn
          retention-days: 30
