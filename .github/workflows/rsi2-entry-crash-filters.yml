name: RSI2 Crash Filters Research
on:
  push:
    branches: [research/rsi2-entry-crash-filters]
    paths:
      - artifacts/trendscanner/rsi2_entry_crash_filters.py
      - artifacts/trendscanner/test_rsi2_entry_crash_filters.py
      - .github/workflows/rsi2-entry-crash-filters.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Check no-lookahead and baseline parity
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_rsi2_entry_crash_filters.py -v
      - name: Compare three fixed filters independently against RSI2 LONG
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/rsi2_entry_crash_filters.py | tee rsi2-entry-filters.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rsi2-entry-filters
          path: rsi2-entry-filters.json
          retention-days: 30
