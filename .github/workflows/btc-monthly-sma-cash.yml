name: BTC Monthly SMA Cash Research
on:
  push:
    branches: [research/btc-monthly-sma-cash]
    paths:
      - artifacts/trendscanner/btc_monthly_sma_cash.py
      - artifacts/trendscanner/test_btc_monthly_sma_cash.py
      - .github/workflows/btc-monthly-sma-cash.yml
permissions:
  contents: read
jobs:
  research-only:
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 15
    env:
      TREND_SCANNER_MARKET_SOURCE: bybit_linear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Verify no lookahead and cost accounting
        run: uv run --no-project --with pandas python -m unittest discover -s artifacts/trendscanner -p test_btc_monthly_sma_cash.py -v
      - name: Run read-only research
        run: |
          set -o pipefail
          uv run --no-project --with pandas python artifacts/trendscanner/btc_monthly_sma_cash.py | tee btc-monthly-sma-cash-result.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: btc-monthly-sma-cash-report
          path: btc-monthly-sma-cash-result.json
          retention-days: 30
