name: VPS Runtime Manager
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect VPS, audit Demo, or request virtual Demo funds
        required: true
        default: inspect
        type: choice
        options: [inspect, install, upgrade, status, audit, enable-hourly-shadow, shadow-status, postgres-inspect, postgres-prepare, postgres-migrate, wallet, fund-demo]
  pull_request:
    branches: [main]
    paths:
      - ops/vps/**
      - artifacts/trendscanner/bybit_demo_executor.py
      - artifacts/trendscanner/test_bybit_demo_executor.py
      - .github/workflows/vps-runtime.yml
permissions:
  contents: read
concurrency:
  group: trendscanner-vps-install
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with pytest --with pyyaml --with "psycopg[binary]" pytest -q ops/vps/test_runtime.py ops/vps/test_audit_demo.py ops/vps/test_monitor.py ops/vps/test_demo_funds.py ops/vps/test_hourly_shadow.py ops/vps/test_postgres_host.py ops/vps/test_postgres_manager.py ops/vps/test_postgres_migrate.py
  manage:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: [self-hosted, linux, x64, bybit-demo]
    timeout-minutes: 30
    steps:
      - name: Inspect server readiness
        run: |
          id
          date -u
          df -h "$HOME"
          timedatectl show -p NTPSynchronized --value
          if sudo -n true 2>/dev/null; then
            echo 'PASSWORDLESS_SYSTEMD_INSTALL=YES'
          else
            echo 'PASSWORDLESS_SYSTEMD_INSTALL=NO'
          fi
          command -v crontab || true
          systemctl is-active cron || true
          systemctl is-enabled cron || true
          systemctl is-active trendscanner-runtime.timer || true
          systemctl is-active trendscanner-runtime.service || true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: patch
      - name: Read local runtime status
        if: inputs.operation == 'status'
        run: |
          python3 patch/ops/vps/runtime.py --status
          systemctl status trendscanner-runtime.timer trendscanner-runtime.service cron --no-pager || true
          if test -f "$HOME/trendscanner-runtime/state/manager.json"; then
            cat "$HOME/trendscanner-runtime/state/manager.json"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path.home() / 'trendscanner-runtime'
          path = root / 'state/status.json'
          if path.exists():
              state = json.loads(path.read_text())
              for task, record in state.get('tasks', {}).items():
                  logfile = root / 'logs' / record.get('log', '')
                  if logfile.is_file():
                      print('TASK LOG:', task)
                      print('\n'.join(logfile.read_text().splitlines()[-100:]))
          PY
      - name: Audit Demo executions without changing orders or the runtime
        if: inputs.operation == 'audit'
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          patch = Path('patch').resolve()
          sys.path.insert(0, str(patch / 'ops/vps'))
          from runtime import run_command
          root = Path.home() / 'trendscanner-runtime'
          workspace = (root / 'current/lower').resolve(strict=True)
          config = json.loads((root / 'credentials.json').read_text())
          args = [str(workspace / '.venv/bin/python'), str(patch / 'ops/vps/audit_demo.py')]
          code, output = run_command(args, workspace, 'demo', config)
          print(output)
          raise SystemExit(code)
          PY
      - name: Read private shadow progress as counts only
        if: inputs.operation == 'shadow-status'
        run: |
          python3 patch/ops/vps/hourly_shadow.py --status
      - name: Inspect VPS capacity for local Postgres without changing configuration
        if: inputs.operation == 'postgres-inspect'
        run: python3 patch/ops/vps/postgres_host.py inspect
      - name: Require merged main for local database preparation or migration
        if: inputs.operation == 'postgres-prepare' || inputs.operation == 'postgres-migrate'
        env:
          BRANCH_REF: ${{ github.ref }}
        run: test "$BRANCH_REF" = 'refs/heads/main'
      - name: Prepare private PostgreSQL and test dump/restore with synthetic data
        if: inputs.operation == 'postgres-prepare'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 patch/ops/vps/postgres_manager.py prepare
          python3 patch/ops/vps/postgres_manager.py smoke-test
          python3 patch/ops/vps/postgres_migrate.py activate-ops --sha "$RELEASE_SHA"
      - name: Upload encrypted synthetic restore proof only
        if: inputs.operation == 'postgres-prepare'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-encrypted-synthetic-proof
          path: /home/runner/trendscanner-postgres/exports/smoke-test.cms
          if-no-files-found: error
          retention-days: 3
      - name: Snapshot the existing Neon source and verify an isolated local restore
        id: postgres-stage
        if: inputs.operation == 'postgres-migrate'
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          patch = Path('patch').resolve()
          sys.path.insert(0, str(patch / 'ops/vps'))
          from runtime import run_command
          root = Path.home() / 'trendscanner-runtime'
          workspace = (root / 'current/lower').resolve(strict=True)
          config = json.loads((root / 'credentials.json').read_text())
          args = [str(workspace / '.venv/bin/python'), str(patch / 'ops/vps/postgres_migrate.py'), 'stage']
          code, output = run_command(args, workspace, 'outcomes', {'DATABASE_URL': config['DATABASE_URL']})
          print(output)
          raise SystemExit(code)
          PY
      - name: Upload only the encrypted pre-migration source backup
        id: postgres-offsite
        if: inputs.operation == 'postgres-migrate' && steps.postgres-stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: postgres-encrypted-pre-migration-backup
          path: /home/runner/trendscanner-postgres/exports/migration-source.cms
          if-no-files-found: error
          retention-days: 14
      - name: Switch only after offsite backup, row hash verification and read-only Demo preflight
        if: inputs.operation == 'postgres-migrate' && steps.postgres-offsite.outcome == 'success'
        env:
          OFFSITE_ARTIFACT_ID: ${{ steps.postgres-offsite.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          patch = Path('patch').resolve()
          sys.path.insert(0, str(patch / 'ops/vps'))
          from runtime import run_command
          root = Path.home() / 'trendscanner-runtime'
          workspace = (root / 'current/lower').resolve(strict=True)
          config = json.loads((root / 'credentials.json').read_text())
          args = [str(workspace / '.venv/bin/python'), str(patch / 'ops/vps/postgres_migrate.py'),
                  'apply', '--artifact-id', os.environ['OFFSITE_ARTIFACT_ID']]
          code, output = run_command(args, workspace, 'outcomes', config)
          print(output)
          raise SystemExit(code)
          PY
      - name: Release a failed migration pause and restore unswitched source configuration
        if: always() && inputs.operation == 'postgres-migrate'
        run: python3 patch/ops/vps/postgres_migrate.py abort
      - name: Enable only the prospective hourly shadow on merged main
        if: inputs.operation == 'enable-hourly-shadow' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: python3 patch/ops/vps/activate_hourly_shadow.py --patch patch/ops/vps --sha "$RELEASE_SHA"
      - name: Read or request virtual Demo USDT
        if: (inputs.operation == 'wallet' || inputs.operation == 'fund-demo') && github.ref == 'refs/heads/main'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          patch = Path('patch').resolve()
          sys.path.insert(0, str(patch / 'ops/vps'))
          from runtime import run_command
          root = Path.home() / 'trendscanner-runtime'
          workspace = (root / 'current/lower').resolve(strict=True)
          config = json.loads((root / 'credentials.json').read_text())
          args = [str(workspace / '.venv/bin/python'), str(patch / 'ops/vps/demo_funds.py')]
          if os.environ['OPERATION'] == 'fund-demo':
              args.append('--apply')
          code, output = run_command(args, workspace, 'demo', config)
          print(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Bybit Demo virtual funds\n\n```json\n' + output + '\n```\n')
          raise SystemExit(code)
          PY
      - name: Require merged main for installation
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        env:
          BRANCH_REF: ${{ github.ref }}
        run: test "$BRANCH_REF" = 'refs/heads/main'
      - uses: actions/checkout@v4
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        with:
          ref: 5547e881078dc97ccb317b5e4f8252eab3fb9a21
          path: lower
      - uses: actions/checkout@v4
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        with:
          ref: 69cb70107baecf0e9b8dc3a0731fa885a338d2ef
          path: four
      - uses: actions/setup-python@v5
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
      - name: Prepare frozen workspaces and authenticated read-only preflight
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
          BYBIT_DEMO_ENABLED: ${{ vars.BYBIT_DEMO_ENABLED }}
          BYBIT_DEMO_START_MS: ${{ vars.BYBIT_DEMO_START_MS }}
          RELEASE_SHA: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if test "$OPERATION" = 'upgrade'; then
            python patch/ops/vps/install.py --patch patch --lower lower --four four --sha "$RELEASE_SHA" --upgrade
          else
            python patch/ops/vps/install.py --patch patch --lower lower --four four --sha "$RELEASE_SHA"
          fi
      - name: Activate the local timer
        if: inputs.operation == 'install'
        run: |
          if sudo -n true 2>/dev/null; then
            sudo -n /usr/bin/python3 "$HOME/trendscanner-runtime/current/ops/install.py" --root "$HOME/trendscanner-runtime" --activate
            systemctl is-active trendscanner-runtime.timer
          else
            python3 "$HOME/trendscanner-runtime/current/ops/install.py" --root "$HOME/trendscanner-runtime" --activate-user-cron
          fi
