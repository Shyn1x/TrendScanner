[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.66",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "streamlit>=1.59.2",
]

[project.optional-dependencies]
# Only needed when DATABASE_URL is set; shadow_storage imports psycopg lazily
# and fails safe (UNAVAILABLE) if it's missing.
postgres = ["psycopg[binary]>=3.2"]
